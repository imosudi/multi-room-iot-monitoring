    <text x="980" y="170" text-anchor="middle" fill="#163A63" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Room 2</text>
    <text x="980" y="206" text-anchor="middle" fill="#446183" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="500">ESP32-S3 + DHT22</text>
    <text x="980" y="232" text-anchor="middle" fill="#6B7F99" font-family="Arial, Helvetica, sans-serif" font-size="16">Temperature / Humidity</text>
