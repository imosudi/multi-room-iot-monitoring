    <path d="M780 190H880" stroke="#6A82A7" stroke-width="5" stroke-linecap="round"/>
    <path d="M420 190C440 190 440 160 460 160H520C540 160 540 190 560 190" stroke="#6A82A7" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M780 190C760 190 760 160 740 160H680C660 160 660 190 640 190" stroke="#6A82A7" stroke-width="5" stroke-linecap="round" fill="none"/>
