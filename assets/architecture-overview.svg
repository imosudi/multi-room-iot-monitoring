  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>

  <text x="600" y="52" text-anchor="middle" fill="#12253F" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Multi-Room oneM2M Air Quality Comparison Platform</text>

